{% extends 'base.html' %}
{% block title %}Cambiar Contrasena - {{ config.nombre_sitio if config else 'MiTienda' }}{% endblock %}
{% block content %}
<div class="panel" style="max-width:480px;margin:0 auto;">
    <h2>Cambiar Contrasena</h2>
    {% if error %}<div class="alerta alerta-error">{{ error }}</div>{% endif %}
    {% if ok %}<div class="alerta alerta-success">{{ ok }}</div>{% endif %}
    <form method="POST" action="{{ url_for('cambiar_password') }}">
        <div class="form-group">
            <label>Contrasena actual</label>
            <input type="password" name="actual" required autofocus>
        </div>
        <div class="form-group">
            <label>Nueva contrasena (minimo 4 caracteres)</label>
            <input type="password" name="nueva" required minlength="4">
        </div>
        <div class="form-group">
            <label>Repetir nueva contrasena</label>
            <input type="password" name="repetir" required>
        </div>
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{{ url_for('home') }}" class="btn btn-secondary">Volver</a>
    </form>
</div>
{% endblock %}
