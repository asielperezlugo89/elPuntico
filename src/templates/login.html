{% extends "base.html" %}
{% block title %}MiTienda - Login{% endblock %}
{% block content %}
<div class="panel" style="max-width:400px;margin:50px auto;">
    <h2>Iniciar Sesion</h2>
    {% if error %}
    <div class="alerta alerta-error">{{ error }}</div>
    {% endif %}
    <form method="POST">
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required>
        </div>
        <div class="form-group">
            <label>Contrasena</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;padding:12px;">Iniciar Sesion</button>
    </form>
    <p style="margin-top:15px;text-align:center;">
        No tienes cuenta? <a href="{{ url_for('registro') }}">Registrate</a>
    </p>
</div>
{% endblock %}
